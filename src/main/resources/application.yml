# 공통 설정. 학교 클러스터 값(주소·비밀번호)은 gitops 레포의 ConfigMap trace-infra와 Secret trace-secrets가 환경 변수로 넣는다
server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: diagnostics-server
  threads:
    virtual:
      enabled: true
  # PostgreSQL: DB trace, 이 서버는 diagnostics 스키마만 쓴다 (infra.env POSTGRES_*, trace-secrets DB_*)
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trace}
    username: ${DB_USERNAME:trace}
    password: ${DB_PASSWORD:}
  flyway:
    schemas: diagnostics
    default-schema: diagnostics
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway만 바꾼다
    properties:
      hibernate:
        default_schema: diagnostics
        jdbc:
          time_zone: UTC
  # RabbitMQ: topic exchange trace.events (infra.env RABBITMQ_*, trace-secrets RABBITMQ_USERNAME·PASSWORD)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  # auth-server가 발급한 RS256 JWT를 JWKS로 검증한다
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:${AUTH_SERVER_URL:http://auth-server:8080}/.well-known/jwks.json}

app:
  commit: ${APP_COMMIT:unknown}   # 이미지에 구운 커밋 SHA. /ping 응답에 실려 배포 확인에 쓴다
  version: '@project.version@'
  jwt:
    issuer: trace
  # 진단 추이(InfluxDB v2, 버킷 trace-pilot). INFLUX_URL이 비면 쓰지 않는다(기본 꺼짐, 학교 서버 Compose는 그대로 뜬다)
  influx:
    url: ${INFLUX_URL:}
    token: ${INFLUX_TOKEN:}
    org: ${INFLUX_ORG:}
    bucket: ${INFLUX_BUCKET:trace-pilot}
    connect-timeout: 2s
    read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness·readiness (쿠버네티스 프로브)
